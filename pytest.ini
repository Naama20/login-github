[pytest]
testpaths = tests test_google_site.py
pythonpath = .
addopts =
    --output=test-results
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    -sv
    
markers =
    selenium: Selenium browser checks
    smoke: critical path checks
    regression: wider coverage, including negative cases
